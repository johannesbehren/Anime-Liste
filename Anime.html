<!DOCTYPE html>
<html lang="de">
<head>
    <link rel="icon" href="Logo.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animes</title>
    <link rel="stylesheet" href="Anime.css">
</head>
<body>
<div class="all">
    <div class="header-container">
        <h1 class="title">Animes, die ich geschaut habe:</h1>
        <div class="data-management-buttons">
            <button id="download-data-btn">Daten herunterladen</button>
            <input type="file" id="upload-data-input" accept=".json" style="display: none;">
            <button id="upload-data-btn">Dateien hochladen</button>
        </div>
    </div>
    
    <div class="anime-list" id="watched-anime-list"></div>

    <h1 class="title" style="margin-top: 40px;">Animes, die ich schauen will:</h1>
    <div class="anime-list" id="watchlist-anime-list"></div>

    <h1 class="title" style="margin-top: 40px;">Animes, die ich nicht mochte:</h1>
    <div class="anime-list" id="bad-anime-list"></div>
</div>

<div id="notes-modal-overlay" class="modal-overlay" style="display:none;">
    <div class="notes-modal">
        <h3 id="modal-title">Notizen & beste Momente für:</h3>

        <label class="modal-label" for="notes-textarea">Allgemeine Notizen:</label>
        <textarea id="notes-textarea" placeholder="Gib deine Notizen hier ein..."></textarea>

        <div class="moments-header">
            <h3>Beste Momente</h3>
            <button type="button" id="add-moment-btn" class="add-moment-btn">+ Moment hinzufügen</button>
        </div>

        <div id="moments-container" class="moments-container"></div>

        <div class="modal-buttons">
            <button id="save-notes-btn">Speichern</button>
            <button id="read-notes-btn">Text vorlesen</button>
            <button id="stop-read-btn" style="display: none;">Stoppen</button>
            <button id="close-notes-btn">Schließen</button>
        </div>
    </div>
</div>
<script src="Anime.js"></script>
</body>
</html>
